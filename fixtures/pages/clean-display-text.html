<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Display text that scales</title>
<style>
* { box-sizing: border-box; } body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.4; }
main { padding: 16px; }
h1 { font-size: clamp(28px, 5vw + 12px, 64px); line-height: 1.1; margin: 0 0 16px; }
h2 { font-size: 30px; line-height: 1.2; }
.stat { font-size: 72px; font-weight: 700; line-height: 1; }
</style>
</head>
<body>
<main>
  <h1>Ship pages that work everywhere</h1>
  <h2>A section heading long enough to wrap onto a few lines on a phone</h2>
  <p class="stat">98%</p>
  <p>Big numbers and headings that scale with the screen are fine.</p>
</main>
</body>
</html>
