<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text against the screen edge</title>
<style>
* { box-sizing: border-box; } body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.4; }
.promo-banner { background: #fde68a; padding: 12px 0; }
.content { padding: 16px; }
.card { border: 1px solid #ddd; padding: 12px; }
</style>
</head>
<body>
<div class="promo-banner" data-bh-expect="edge-gutter@320-767">Free shipping on every order this week only</div>
<main class="content">
  <h1>Shop</h1>
  <div class="card"><p>A properly padded card that stays away from the edges.</p></div>
</main>
</body>
</html>
