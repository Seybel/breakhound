<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile menu overflows when open</title>
<style>
* { box-sizing: border-box; } body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.4; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; background: #222; color: #fff; }
.logo { padding: 12px 16px; }
.links { display: flex; list-style: none; margin: 0; padding: 0; }
.links a { display: block; padding: 12px 16px; color: inherit; text-decoration: none; }
.burger { display: none; margin: 4px 16px; padding: 10px 14px; font: inherit; }
#site-menu { width: 100%; background: #333; }
#site-menu a { display: block; padding: 12px 16px; color: #fff; text-decoration: none; }
.menu-promo { width: 400px; padding: 12px 16px; background: #ffd; color: #222; }
@media (max-width: 767px) {
  .links { display: none; }
  .burger { display: block; }
}
@media (min-width: 768px) { #site-menu { display: none; } }
main { padding: 16px; }
</style>
</head>
<body data-breakhound-ignore="edge-gutter">
<header>
  <div class="logo">Acme</div>
  <ul class="links"><li><a href="#">Product</a></li><li><a href="#">Pricing</a></li><li><a href="#">Blog</a></li></ul>
  <button class="burger" type="button" aria-expanded="false" aria-controls="site-menu">Menu</button>
  <nav id="site-menu" hidden>
    <a href="#">Product</a>
    <a href="#">Pricing</a>
    <a href="#">Blog</a>
    <div class="menu-promo" data-bh-expect="page-overflow@320-399:open">Spring sale: everything half price this week</div>
  </nav>
</header>
<main><p>Content</p></main>
<script>
const burger = document.querySelector('.burger');
const menu = document.getElementById('site-menu');
burger.addEventListener('click', () => {
  const open = burger.getAttribute('aria-expanded') === 'true';
  burger.setAttribute('aria-expanded', String(!open));
  menu.hidden = open;
});
</script>
</body>
</html>
