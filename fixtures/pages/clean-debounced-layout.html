<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel sized by a debounced resize handler, fine once it has run</title>
<style>
* { box-sizing: border-box; } body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.4; }
.panel { height: 120px; background: #def; }
</style>
</head>
<body data-breakhound-ignore="edge-gutter">
<div class="panel">Panel sized by JavaScript</div>
<script>
  const panel = document.querySelector('.panel');
  const apply = () => { panel.style.width = Math.min(window.innerWidth, 1200) + 'px'; };
  let timer;
  window.addEventListener('resize', () => {
    clearTimeout(timer);
    timer = setTimeout(apply, 300);
  });
  apply();
</script>
</body>
</html>
