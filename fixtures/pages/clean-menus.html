<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menus, accordions and dialogs that behave</title>
<style>
* { box-sizing: border-box; } body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.4; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; background: #222; color: #fff; }
.logo { padding: 12px 16px; }
.links { display: flex; list-style: none; margin: 0; padding: 0; }
.links a { display: block; padding: 12px 16px; color: inherit; text-decoration: none; }
.burger { display: none; margin: 4px 16px; padding: 10px 14px; font: inherit; }
#nav-panel { width: 100%; background: #333; }
#nav-panel a { display: block; padding: 12px 16px; color: #fff; text-decoration: none; }
@media (max-width: 767px) { .links { display: none; } .burger { display: block; } }
@media (min-width: 768px) { #nav-panel { display: none; } }
main { padding: 16px; max-width: 720px; }
.faq button { display: block; width: 100%; padding: 12px; font: inherit; text-align: left; }
.faq div { padding: 8px 12px; }
dialog { max-width: calc(100% - 32px); }
dialog button, .open, .menu-toggle { padding: 10px 14px; font: inherit; }
summary { padding: 12px 0; }
.away { display: inline-block; padding: 12px; }
</style>
</head>
<body data-breakhound-ignore="edge-gutter">
<header>
  <div class="logo">Acme</div>
  <ul class="links"><li><a href="#">Product</a></li><li><a href="#">Pricing</a></li></ul>
  <button class="burger" type="button" aria-expanded="false" aria-controls="nav-panel" aria-label="Open main menu">=</button>
  <nav id="nav-panel" hidden><a href="#">Product</a><a href="#">Pricing</a></nav>
</header>
<main>
  <h1>Help</h1>
  <section class="faq">
    <h2>Questions</h2>
    <button type="button" aria-expanded="false" aria-controls="a1">How do refunds work?</button>
    <div id="a1" hidden>Within 30 days, no questions asked.</div>
    <button type="button" aria-expanded="false" aria-controls="a2">Do you ship abroad?</button>
    <div id="a2" hidden>To most countries in Europe.</div>
    <button type="button" aria-expanded="false" aria-controls="a3">Can I change my order?</button>
    <div id="a3" hidden>Until it has been packed.</div>
  </section>
  <details><summary>Shipping details</summary><p>Two to four working days.</p></details>
  <p><button class="open" type="button" aria-haspopup="dialog">Contact us</button></p>
  <dialog id="contact"><p>Write to us any time and we answer within a day.</p><button type="button" class="close">Close</button></dialog>
  <form action="javascript:void 0"><button class="menu-toggle">Menu</button></form>
  <a class="away" href="other-page.html" aria-haspopup="true">Account</a>
  <button class="away" type="button" aria-expanded="false" onclick="location.href = 'other-page.html'">Orders</button>
</main>
<script>
const burger = document.querySelector('.burger');
const panel = document.getElementById('nav-panel');
burger.addEventListener('click', () => {
  const open = burger.getAttribute('aria-expanded') === 'true';
  burger.setAttribute('aria-expanded', String(!open));
  panel.hidden = open;
});
for (const b of document.querySelectorAll('.faq button')) {
  b.addEventListener('click', () => {
    const open = b.getAttribute('aria-expanded') === 'true';
    b.setAttribute('aria-expanded', String(!open));
    document.getElementById(b.getAttribute('aria-controls')).hidden = open;
  });
}
const dialog = document.getElementById('contact');
document.querySelector('.open').addEventListener('click', () => dialog.showModal());
dialog.querySelector('.close').addEventListener('click', () => dialog.close());
</script>
</body>
</html>
