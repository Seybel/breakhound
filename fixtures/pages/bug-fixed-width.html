<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixed width block</title>
<style>
* { box-sizing: border-box; } body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.4; }

</head>
<body data-breakhound-ignore="edge-gutter">
<main>
  <h1>Pricing</h1>

</main>
</body>
</html>
