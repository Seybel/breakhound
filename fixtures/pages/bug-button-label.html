<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button label wraps</title>
<style>
* { box-sizing: border-box; } body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.4; }
.actions { display: flex; gap: 8px; padding: 16px; }
.actions button { width: 14vw; padding: 8px; font: inherit; }
</style>
</head>
<body>
<div class="actions">
  <button type="button" class="primary" data-bh-expect="unexpected-wrap">Start free trial</button>
  <button type="button">Docs</button>
</div>
</body>
</html>
