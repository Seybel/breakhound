<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlapping media queries</title>
<style>
* { box-sizing: border-box; } body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.4; }
.promo { width: 400px; max-width: calc(100vw - 20px); height: 60px; background: #efe; }
@media (max-width: 768px) { .promo { width: 500px; } }
@media (min-width: 768px) { .promo { margin-left: 300px; } }
</style>
</head>
<body>
<div class="promo" data-bh-expect="page-overflow@768-768">Promo</div>
</body>
</html>
