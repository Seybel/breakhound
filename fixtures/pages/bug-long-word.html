<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unbreakable text</title>
<style>
* { box-sizing: border-box; } body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.4; }
article { padding: 16px; max-width: 720px; margin: 0 auto; }
</style>
</head>
<body data-breakhound-ignore="edge-gutter">
<article>
  <h1>Setup</h1>
  <p data-bh-expect="page-overflow">Point your client at https://api.example.com/v2/organisations/acme-corporation/projects/responsive-audit/webhooks/subscriptions and restart it.</p>
</article>
</body>
</html>
