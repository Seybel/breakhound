<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny text on phones</title>
<style>
* { box-sizing: border-box; } body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.4; }
main { padding: 16px; }
.legal { font-size: 10px; }
</style>
</head>
<body>
<main>
  <p>Regular body copy.</p>
  <p class="legal" data-bh-expect="tiny-text@320-767">Prices include tax where applicable.</p>
</main>
</body>
</html>
