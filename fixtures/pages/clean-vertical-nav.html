<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nav that stacks on mobile</title>
<style>
* { box-sizing: border-box; } body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.4; }
nav ul { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0; padding: 12px; }
nav a { display: block; padding: 8px 12px; background: #eee; }
@media (max-width: 599px) { nav ul { flex-direction: column; } }
</style>
</head>
<body data-breakhound-ignore="edge-gutter">
<nav><ul><li><a href="#">Home</a></li><li><a href="#">Docs</a></li><li><a href="#">Blog</a></li><li><a href="#">Contact</a></li></ul></nav>
</body>
</html>
