<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stretched image</title>
<style>
* { box-sizing: border-box; } body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.4; }
main { padding: 16px; max-width: 900px; margin: 0 auto; }
.banner { display: block; width: 100%; height: 180px; }
.cover { display: block; width: 100%; height: 180px; object-fit: cover; margin-top: 16px; }
.proportional { display: block; width: 100%; height: auto; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <img class="banner" alt="Banner" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACgAAAAUCAIAAABwJOjsAAAAJElEQVR4nGOomHZiQBDDqMWjFo9aPGrxqMWjFo9aPGrxyLEYAMm2vQwIWPbtAAAAAElFTkSuQmCC" data-bh-expect="distorted-media">
  <img class="cover" alt="Cover" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACgAAAAUCAIAAABwJOjsAAAAJElEQVR4nGOomHZiQBDDqMWjFo9aPGrxqMWjFo9aPGrxyLEYAMm2vQwIWPbtAAAAAElFTkSuQmCC">
  <img class="proportional" alt="Proportional" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACgAAAAUCAIAAABwJOjsAAAAJElEQVR4nGOomHZiQBDDqMWjFo9aPGrxqMWjFo9aPGrxyLEYAMm2vQwIWPbtAAAAAElFTkSuQmCC">
</main>
</body>
</html>
