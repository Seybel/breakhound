<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Date picker wider than small screens</title>
<style>
* { box-sizing: border-box; } body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.4; }
main { padding: 16px; }
.picker { display: inline-block; padding: 12px; border: 1px solid #ccc; border-radius: 8px; }
/* Each date keeps 48px, so the picker needs 360px. */
.dates { display: grid; grid-template-columns: repeat(7, 48px); gap: 2px; }
.dates span { font-size: 13px; text-align: center; color: #555; }
.date { height: 40px; font: inherit; background: none; border: 0; border-radius: 4px; }
</style>
</head>
<body>
<main>
<h1>Events</h1>
<label for="when">When</label><div class="picker" id="when" data-bh-expect="page-overflow@320-389"><div class="dates"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span><button type="button" class="date">1</button><button type="button" class="date">2</button><button type="button" class="date">3</button><button type="button" class="date">4</button><button type="button" class="date">5</button><button type="button" class="date">6</button><button type="button" class="date">7</button><button type="button" class="date">8</button><button type="button" class="date">9</button><button type="button" class="date">10</button><button type="button" class="date">11</button><button type="button" class="date">12</button><button type="button" class="date">13</button><button type="button" class="date">14</button><button type="button" class="date">15</button><button type="button" class="date">16</button><button type="button" class="date">17</button><button type="button" class="date">18</button><button type="button" class="date">19</button><button type="button" class="date">20</button><button type="button" class="date">21</button><button type="button" class="date">22</button><button type="button" class="date">23</button><button type="button" class="date">24</button><button type="button" class="date">25</button><button type="button" class="date">26</button><button type="button" class="date">27</button><button type="button" class="date">28</button><button type="button" class="date">29</button><button type="button" class="date">30</button><button type="button" class="date">31</button></div></div>
</main>
</body>
</html>
